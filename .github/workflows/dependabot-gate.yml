# The Dependabot merge gate, on its own so a repo that builds several images can
# run it once, after all of them pass (app-ci.yml calls it for single-image repos).
#
#   patch and minor updates: merge, then dispatch the caller's workflow on main
#     (a merge made with GITHUB_TOKEN starts no push workflow; dispatch is the
#     documented exception)
#   majors: label waits-for-devin and leave for review
#
# Callers need: contents, pull-requests and actions write. It does nothing for
# anything but a Dependabot pull request.

name: dependabot-gate

on:
  workflow_call:
    inputs:
      caller-workflow:
        description: "The calling workflow file, dispatched on main after a merge"
        type: string
        default: "ci.yml"

jobs:
  gate:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge patch and minor updates, then build main
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          WORKFLOW: ${{ inputs.caller-workflow }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -eu
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          echo "### Merged #$PR ($UPDATE) and started the main build" >> "$GITHUB_STEP_SUMMARY"

      - name: Majors wait for Devin
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create waits-for-devin --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "Major update: merged by hand after review" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label waits-for-devin
